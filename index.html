<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGNS Terminal · AiLGNS 链上数据终端</title>
<meta name="description" content="AiLGNS / AWAKE HELIX 链上数据终端：价格、K 线、五池、储备、排放、算力、销毁资格、治理、涡轮、持币、地址查询、合约权限。本地运行，只读公开数据。">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231d3f8f'/%3E%3Ctext x='32' y='42' font-size='24' font-family='Menlo,monospace' font-weight='800' text-anchor='middle' fill='%23fff'%3ELT%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("lt-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
html.lt-lock body > :not(#ltGate){visibility:hidden!important}
html.lt-lock body{overflow:hidden!important}
#ltGate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:radial-gradient(circle at 50% 28%,#1d3f8f 0%,#0d1726 58%,#070b11 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#e4e9f1}
#ltGate[hidden]{display:none}
#ltGate .ltg-box{width:min(360px,100%);padding:32px 26px 22px;border-radius:14px;background:rgba(18,24,34,.94);border:1px solid rgba(130,160,210,.22);box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center}
#ltGate .ltg-logo{width:52px;height:52px;margin:0 auto 16px;border-radius:12px;background:linear-gradient(135deg,#2f5fd0,#1d3f8f);display:flex;align-items:center;justify-content:center;font:800 20px/1 Menlo,monospace;color:#fff;letter-spacing:.5px}
#ltGate h1{margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:.2px}
#ltGate .ltg-sub{margin:0 0 20px;font-size:12.5px;color:#8591a5}
#ltGate input{width:100%;box-sizing:border-box;height:44px;padding:0 14px;border-radius:8px;border:1px solid #2a3648;background:#0b0f16;color:#e4e9f1;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
#ltGate input:focus{border-color:#3f6fd8;box-shadow:0 0 0 3px rgba(63,111,216,.18)}
#ltGate button{width:100%;height:44px;margin-top:12px;border:0;border-radius:8px;background:linear-gradient(135deg,#2f5fd0,#1d3f8f);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#ltGate button:hover{filter:brightness(1.08)}
#ltGate button:disabled{opacity:.6;cursor:default}
#ltGate .ltg-err{min-height:18px;margin:10px 0 0;font-size:12.5px;color:#ff8a8f}
#ltGate .ltg-foot{margin:14px 0 0;font-size:11px;color:#5c6779}
</style>
<script>(function(){try{if(localStorage.getItem("lt-auth")==="1")return}catch(e){}document.documentElement.classList.add("lt-lock")})();</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ltGate" hidden>
  <form class="ltg-box" id="ltForm" autocomplete="off">
    <div class="ltg-logo">LT</div>
    <h1>LGNS Terminal</h1>
    <p class="ltg-sub">私密终端 · 请输入访问密码</p>
    <input id="ltPwd" type="password" autocomplete="current-password" placeholder="访问密码" aria-label="访问密码" required>
    <button type="submit" id="ltBtn">进入</button>
    <p class="ltg-err" id="ltErr" role="alert"></p>
    <p class="ltg-foot">仅限本人使用</p>
  </form>
</div>
<div class="strip"><div class="strip-in" id="strip"><div class="it"><span>正在连接 Anubis 链与官方接口…</span></div></div></div>
<header class="hdr">
  <div class="hdr-in">
    <button class="ib" id="menuBtn" aria-label="菜单">☰</button>
    <a class="brand" href="#/overview"><span class="lg">LT</span><span><b>LGNS Terminal</b><small>AiLGNS · Anubis Chain</small></span></a>
    <form class="hsearch" id="hs" autocomplete="off"><input id="hsIn" placeholder="粘贴 0x 钱包地址，回车直接查" spellcheck="false" aria-label="搜索地址"></form>
    <div class="hbtns">
      <button class="ib" id="themeBtn" title="深色 / 浅色">◐</button>
      <button class="ib" id="refreshBtn" title="立即刷新">↻</button>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="导航"></nav>
  <main id="main" tabindex="-1"><div class="wrap" id="page"></div></main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><button class="modal-x" data-close aria-label="关闭">×</button><div id="modalBody"></div></div></div>
<script>
(function(){
  var gate=document.getElementById("ltGate");
  if(!document.documentElement.classList.contains("lt-lock")){ if(gate&&gate.parentNode) gate.parentNode.removeChild(gate); return; }
  gate.hidden=false;
  var form=document.getElementById("ltForm"), pwd=document.getElementById("ltPwd"), btn=document.getElementById("ltBtn"), err=document.getElementById("ltErr");
  var HASH="821d758c55fb1a0f118c3572da0a197d2b02311bf893318b20125930675891e1";
  function hex(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++){s+=(a[i]<16?"0":"")+a[i].toString(16)}return s}
  function digest(str){
    if(!(window.crypto&&crypto.subtle&&crypto.subtle.digest)) return Promise.reject(new Error("unsupported"));
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(hex);
  }
  setTimeout(function(){try{pwd.focus()}catch(e){}},30);
  form.addEventListener("submit",function(e){
    e.preventDefault(); err.textContent=""; btn.disabled=true;
    digest("lt-v1:"+pwd.value).then(function(h){
      if(h!==HASH) throw new Error("bad");
      try{localStorage.setItem("lt-auth","1")}catch(e){}
      document.documentElement.classList.remove("lt-lock");
      if(gate.parentNode) gate.parentNode.removeChild(gate);
    }).catch(function(){ err.textContent="密码不对，请重试"; pwd.value=""; try{pwd.focus()}catch(e){} })
      .then(function(){ btn.disabled=false; });
  });
})();
</script>
<script src="app.js"></script>
</body>
</html>
