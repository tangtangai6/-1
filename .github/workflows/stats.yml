name: stats
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: lgns-data-${{ github.run_id }}
          restore-keys: lgns-data-
      - name: stats
        run: node --max-old-space-size=6144 tools/stats.js
      - uses: actions/upload-artifact@v4
        with:
          name: stats
          path: stats.json
