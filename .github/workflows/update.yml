name: 更新 LGNS Terminal

on:
  schedule:
    - cron: "17 */4 * * *"   # 每 4 小时一次（UTC 时间，北京时间 0/4/8/12/16/20 点过 17 分）
  workflow_dispatch:          # 允许在 Actions 页面手动点「Run workflow」

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lgns-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 扫链进度存在 GitHub 缓存里（约 120MB 压缩），每次只补新区块
      - name: 读取上次的扫链进度
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: lgns-data-${{ github.run_id }}
          restore-keys: lgns-data-

      - name: 扫链并生成网页
        env:
          MAX_SEC: "4800"
          LEVEL_CONC: "24"
        run: |
          node --max-old-space-size=6144 collector.js --once --standalone
          test -f LGNS-Terminal.html

      - name: 保存扫链进度
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: lgns-data-${{ github.run_id }}

      - name: 准备网页
        run: |
          mkdir -p site
          cp LGNS-Terminal.html site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
