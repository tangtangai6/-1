name: 更新 LGNS Terminal

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟（UTC）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lgns-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 扫链进度存在 GitHub 缓存里（约 115MB 压缩），每次只补新区块
      - name: 读取上次的扫链进度
        uses: actions/cache/restore@v4
        with:
          path: data
          key: lgns-data-${{ github.run_id }}
          restore-keys: lgns-data-

      - name: 扫链并生成网页
        env:
          MAX_SEC: "4800"
          LEVEL_CONC: "24"
        run: |
          node --max-old-space-size=6144 collector.js --once --standalone
          test -f LGNS-Terminal.html

      - name: 生成团队新增查询数据
        run: node --max-old-space-size=6144 tools/build-growth.js

      - name: 保存扫链进度
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: lgns-data-${{ github.run_id }}

      - name: 准备发布目录
        run: |
          mkdir -p site/data
          cp LGNS-Terminal.html site/index.html
          cp -R growth-data/. site/data/

      - name: 部署到 Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.165.0 deploy
