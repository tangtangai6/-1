name: 网络测试
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://rpc.anubispace.org https://rpc2.anubispace.org https://rpc3.anubispace.org; do
            echo "== $u"; curl -s -m 20 -w "  http=%{http_code} time=%{time_total}s\n" -X POST -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' $u || echo "  FAIL"
            curl -s -m 30 -o /dev/null -w "  getLogs 5000块 http=%{http_code} size=%{size_download} time=%{time_total}s\n" -X POST -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_getLogs","params":[{"address":"0xe884a336550a4482ca6a17a3f93aa30ed4ed9bad","fromBlock":"0x1280000","toBlock":"0x1281387"}]}' $u || echo "  FAIL"
          done
          echo "== awakehelix"; curl -s -m 20 -o /dev/null -w "  http=%{http_code} time=%{time_total}s\n" https://awakehelix.io/api/v1/level || echo FAIL
          echo "== blockscout"; curl -s -m 20 -o /dev/null -w "  http=%{http_code} time=%{time_total}s\n" https://browser.anubispace.org/api/v2/stats || echo FAIL
